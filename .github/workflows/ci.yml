name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push/PR run on the same ref supersedes the queued one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `cache: npm` above does not cover the Electron binary, which
      # @electron/get stores in its own per-OS cache directory; without
      # this every run re-downloads ~100 MB per runner.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Exercise the production bundling path (renderer via Vite, main
      # ESM + preload CJS via esbuild) so a broken build fails the PR
      # instead of surfacing at release time.
      - name: Build
        run: npm run build
