name: Agent Review

on:
  # pull_request, not pull_request_target: on a fork PR this gets no secrets
  # and a read-only token, so checking out and running the PR's code is safe.
  # Same-repo PRs (the ones the agent opens) keep secrets as before.
  # pull_request does not fire on PRs with merge conflicts (GitHub can't build
  # the merge ref) — resolving those is agent-update-branch's job.
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Provider/model config lives here, not in code (tune cost and quality
      # by editing env vars only). Consumed by agentFromEnv() in
      # .sandcastle/agent-workflows/shared/common.ts.
      AGENT_PROVIDER: zai
      AGENT_MODEL: glm-5.3-flash:max

    steps:
      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Checkout credentials persist into git push. The push must be
          # able to carry .github/workflows/* changes, which a plain
          # GITHUB_TOKEN is refused for (README, deviations entry 8); the
          # gh API calls keep using GITHUB_TOKEN via GH_TOKEN above.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare branch
        run: |
          git fetch origin main:main || git fetch origin main
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install pi CLI
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Run review agent
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/review/review.ts

      - name: Push branch
        if: success()
        run: |
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during review run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post PR review
        if: success()
        env:
          PAYLOAD: ${{ runner.temp }}/review_payload.json
        run: gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/reviews" --input "$PAYLOAD"

      - name: Mark PR ready
        if: success()
        run: gh pr ready "$PR_NUMBER" || true

      # The human merge click, automated (ADR 0011): a clean review — zero
      # inline comments in the extracted payload — requests a squash
      # auto-merge, which GitHub performs as soon as the PR is mergeable.
      # The request rides AGENT_PAT when present: GITHUB_TOKEN-authored PRs
      # refuse auto-merge requests from their own GITHUB_TOKEN, and the PAT
      # keeps the eventual merge attributed to the maintainer, not
      # github-actions[bot]. Findings hold the merge loudly instead: the
      # comment names the retry loop (agent:implement-pr, then re-add
      # agent:review) so a held PR never silently merges past unresolved
      # findings.
      - name: Request auto-merge on clean review
        if: success()
        env:
          PAYLOAD: ${{ runner.temp }}/review_payload.json
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          findings=$(jq '.inlineComments | length' "$PAYLOAD")
          if [ "$findings" -gt 0 ]; then
            echo "Review posted $findings inline comment(s) — holding the merge."
            gh pr comment "$PR_NUMBER" --body "Review posted **$findings** inline comment(s) — auto-merge held. Address them (label the PR \`agent:implement-pr\`), then re-add \`agent:review\`."
            exit 0
          fi
          # CI gate: the merge requests ride a PAT that can bypass a future
          # branch protection, so the workflow verifies CI itself instead of
          # assuming protection (same stance as the tenderagent merge gate).
          # --watch waits out pending checks — a review that finishes before
          # CI isn't held spuriously — and exits non-zero on any red check.
          if ! gh pr checks "$PR_NUMBER" --watch --interval 30; then
            echo "CI is not green — holding the merge."
            gh pr comment "$PR_NUMBER" --body "CI is not green on the head commit — auto-merge held. When CI passes, re-add \`agent:review\` (the review findings are already clean)."
            exit 0
          fi
          set +e
          if [ -n "$AGENT_PAT" ]; then
            GH_TOKEN="$AGENT_PAT" gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "Squash auto-merge requested; GitHub merges when the PR is mergeable."
              exit 0
            fi
            echo "AGENT_PAT auto-merge request failed (status $status); trying GITHUB_TOKEN."
          fi
          GH_TOKEN="$GITHUB_TOKEN_FALLBACK" gh pr merge "$PR_NUMBER" --squash --auto --delete-branch

      - name: Post thread replies
        if: success()
        env:
          REPLIES: ${{ runner.temp }}/replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:review` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:review` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
